<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Déclic</title>
<meta name="description" content="Apprendre les maths, les sciences et le code en français : un peu de théorie, des figures à manipuler, des exercices corrigés tout de suite.">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout : catalogue en grille par domaine → lecteur de leçon plein écran, une carte à la fois, barre d'action collée en bas */
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --ink:#13233A; --muted:#5A6B80; --line:#DCE3EC;
  --accent:#0A7B76; --accent-ink:#FFFFFF; --accent-soft:#DDF1EF;
  --spark:#F2A900; --spark-soft:#FFF3D1;
  --ok:#1E8A4C; --ok-soft:#E1F4E8; --bad:#C2413A; --bad-soft:#FBE6E4;
  --math:#2F6FE0; --sci:#0A7B76; --code:#7A4FD8; --other:#D9631E;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1622; --surface:#16212F; --ink:#E7EDF5; --muted:#93A3B8; --line:#26354A;
  --accent:#3CC2B9; --accent-ink:#06201E; --accent-soft:#123A3A;
  --spark:#FFC233; --spark-soft:#3A2F12;
  --ok:#4CC27E; --ok-soft:#143424; --bad:#F07068; --bad-soft:#3D1D1C;
  --math:#6E9CF5; --sci:#3CC2B9; --code:#A88AF0; --other:#F08A4B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1622; --surface:#16212F; --ink:#E7EDF5; --muted:#93A3B8; --line:#26354A;
  --accent:#3CC2B9; --accent-ink:#06201E; --accent-soft:#123A3A;
  --spark:#FFC233; --spark-soft:#3A2F12;
  --ok:#4CC27E; --ok-soft:#143424; --bad:#F07068; --bad-soft:#3D1D1C;
  --math:#6E9CF5; --sci:#3CC2B9; --code:#A88AF0; --other:#F08A4B; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--f-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* En-tête */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.logo{font:800 26px var(--f-display);letter-spacing:-.02em;display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;padding:0}
.logo i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--spark);box-shadow:0 0 0 4px var(--spark-soft)}
.stats{margin-left:auto;display:flex;gap:10px}
.pill{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font:700 15px var(--f-display);font-variant-numeric:tabular-nums}
.pill svg{width:18px;height:18px}

/* Accueil */
.hero{padding-block:40px 24px;display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:center}
.hero h1{font-size:clamp(34px,6vw,58px);font-weight:800;letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{color:var(--muted);max-width:48ch;margin:14px 0 0}
.resume{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:12px}
.resume small{text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-size:12px;font-weight:700}
.resume h3{font-size:22px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.btn{appearance:none;border:0;border-radius:14px;padding:13px 22px;font:700 17px var(--f-display);cursor:pointer;background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn[disabled]{background:var(--line);color:var(--muted);box-shadow:none;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}

.domain{padding-block:22px}
.domain-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.domain-head h2{font-size:24px}
.domain-head span{color:var(--muted);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.course{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;grid-template-rows:auto auto 1fr auto;gap:8px;cursor:pointer;transition:transform .15s,border-color .15s;min-width:0}
.course:hover{transform:translateY(-2px);border-color:var(--c)}
.course.soon{cursor:default;opacity:.72}
.course.soon:hover{transform:none;border-color:var(--line)}
.course .ill{height:92px;border-radius:12px;background:color-mix(in srgb,var(--c) 12%,var(--surface));display:grid;place-items:center;overflow:hidden}
.course .ill svg{width:100%;height:100%}
.course h3{font-size:19px}
.course p{margin:0;color:var(--muted);font-size:15px;line-height:1.4}
.course .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.tag{font:700 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.tag.new{background:var(--spark-soft);color:color-mix(in srgb,var(--spark) 70%,var(--ink))}
footer{padding-block:30px 50px;color:var(--muted);font-size:14px}

/* Lecteur de leçon */
#player{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.p-top{display:flex;align-items:center;gap:14px;padding-block:14px}
.x{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none}
.segs{flex:1;display:flex;gap:5px}
.segs span{flex:1;height:8px;border-radius:99px;background:var(--line);transition:background .3s}
.segs span.done{background:var(--accent)}
.segs span.cur{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.p-body{flex:1;overflow-y:auto}
.card{max-width:680px;margin:0 auto;padding-block:10px 40px;display:grid;gap:18px;animation:in .35s ease-out}
@keyframes in{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.course,.bar>span{transition:none}}
.kicker{font:700 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.card h2{font-size:clamp(26px,4.5vw,34px);letter-spacing:-.02em}
.card p{margin:0}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;justify-items:center}
.fig svg{max-width:100%;height:auto;display:block}
.fig .cap{font-size:14px;color:var(--muted);text-align:center}
.formula{font:600 22px var(--f-mono);text-align:center}
.formula b{color:var(--accent)}
.note{background:var(--spark-soft);border-radius:14px;padding:12px 16px;font-size:16px}
code,.code{font-family:var(--f-mono);font-size:.92em}
pre.code{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0;overflow-x:auto;line-height:1.6;font-size:15px}
.kw{color:var(--code);font-weight:600}.num{color:var(--other)}.fn{color:var(--accent)}.str{color:var(--ok)}.com{color:var(--muted);font-style:italic}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.course .codes{font:600 12px var(--f-mono);color:var(--muted)}
.sem{margin-top:26px}
.sem h2{font-size:22px}
.sem .sub{color:var(--muted);font-size:15px;margin:4px 0 0}
.card table{border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums;display:block;overflow-x:auto;max-width:100%}
.card th,.card td{border:1px solid var(--line);padding:6px 10px;text-align:center}
.card th{background:var(--accent-soft)}
.ptext pre.code{margin:12px 0}.ptext>p{margin:0 0 10px}
.disclaim{font-size:13px;color:var(--muted);margin:6px 0 0}
.choices{display:grid;gap:10px}
.choices.row{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.choice{text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;box-shadow:0 2px 0 var(--line)}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.slider{width:100%;display:grid;gap:6px}
.slider label{display:flex;justify-content:space-between;font-weight:700}
.slider output{font-family:var(--f-mono);color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:12px;justify-content:center}
.stepper button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font:700 22px var(--f-display);cursor:pointer}
.stepper output{font:700 30px var(--f-mono);min-width:2ch;text-align:center;color:var(--accent)}

/* Barre d'action */
.p-foot{border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px);transition:background .2s}
.p-foot.ok{background:var(--ok-soft);border-color:var(--ok)}
.p-foot.bad{background:var(--bad-soft);border-color:var(--bad)}
.p-foot .wrap{max-width:712px;display:flex;align-items:center;gap:16px;padding-block:16px;flex-wrap:wrap}
.fb{flex:1 1 260px;min-width:0}
.fb strong{font:700 19px var(--f-display);display:block}
.p-foot.ok .fb strong{color:var(--ok)}
.p-foot.bad .fb strong{color:var(--bad)}
.fb span{font-size:15px;color:var(--ink)}
.p-foot .btn{margin-left:auto;min-width:160px}
.p-foot.ok .btn{background:var(--ok);box-shadow:0 3px 0 color-mix(in srgb,var(--ok) 60%,#000)}

/* Piano */
.piano{position:relative;width:100%;max-width:520px;height:150px;user-select:none;touch-action:manipulation}
.key{position:absolute;top:0;border:1px solid var(--ink);cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font:700 11px var(--f-body);transition:background .08s}
.key.w{background:#FDFDFB;color:#5A6B80;height:100%;border-radius:0 0 8px 8px;z-index:1}
.key.b{background:#1A2230;color:#C9D3E0;height:60%;border-radius:0 0 6px 6px;z-index:2;font-size:9px}
.key.hi{background:var(--spark)!important;color:#13233A!important}
.key.on{background:var(--accent)!important;color:#fff!important}

.done-wrap{display:grid;justify-items:center;text-align:center;gap:16px;padding-block:40px}
.big-xp{font:800 64px var(--f-display);color:var(--spark)}

/* Notation */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.85em;line-height:1.15;margin:0 .1em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.mat{display:inline-grid;gap:2px 14px;vertical-align:middle;padding:2px 8px;border-left:2px solid currentColor;border-right:2px solid currentColor;border-radius:6px;font-family:var(--f-mono);font-size:.9em;text-align:center}
.fig .info{font-size:16px;color:var(--ink);min-height:1.5em}
.sliders{width:100%;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.draw{width:100%;display:grid;justify-items:center}
.numin{display:grid;gap:8px;justify-items:start}
.numin label{font-weight:700}
.numin div{display:flex;align-items:center;gap:10px}
.numin input{font:600 24px var(--f-mono);width:9ch;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.numin input:focus{border-color:var(--accent);outline:none}
.numin input.right{border-color:var(--ok);background:var(--ok-soft)}
.numin input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.numin span{font-weight:700;color:var(--muted)}

/* Parcours maths */
.math-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}
.math-head h2{font-size:clamp(28px,4vw,38px);letter-spacing:-.02em}
.math-head p{margin:6px 0 0;color:var(--muted)}
.levels{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.levels button{border:0;background:none;padding:8px 14px;border-radius:10px;cursor:pointer;font:700 15px var(--f-display);color:var(--muted);display:grid;text-align:left;line-height:1.2}
.levels button small{font:400 12px var(--f-body)}
.levels button[aria-selected="true"]{background:var(--math);color:#fff}
.branches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
.branch{display:grid;gap:12px;min-width:0}
.branch>h3{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--f-body);padding-bottom:6px;border-bottom:2px solid var(--line)}
.course .ill.plot{height:120px;padding:6px}
.crumb{background:none;border:0;cursor:pointer;color:var(--accent);font-weight:700;padding:0;display:inline-flex;gap:6px;align-items:center}
.cpage{padding-block:28px 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:start}
.cpage h1{font-size:clamp(32px,5vw,48px);letter-spacing:-.03em;margin-top:10px}
.cpage .lead{color:var(--muted);margin:10px 0 0}
.cpage .ill{border-radius:18px;background:var(--surface);border:1px solid var(--line);padding:14px;display:grid;place-items:center}
.cpage .ill svg{width:100%;height:auto;max-height:340px}
.lessons{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:10px}
.lessons li{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.lessons li .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--f-display);background:var(--line);color:var(--muted)}
.lessons li.play .n{background:var(--math);color:#fff}
.lessons li.fin .n{background:var(--ok);color:#fff}
.lessons li .s{font-size:13px;color:var(--muted);font-weight:700}
.lessons li .btn{padding:9px 16px;font-size:15px}

@media (max-width:860px){ .branches{grid-template-columns:1fr} .cpage{grid-template-columns:1fr} }
@media (max-width:720px){
  .hero{grid-template-columns:1fr;padding-block:24px 8px}
  .stats .pill.lbl span.t{display:none}
  .p-foot .btn{width:100%;margin-left:0}
}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <button class="logo" id="home-btn" aria-label="Accueil Déclic"><i></i>Déclic</button>
  <div class="stats">
    <div class="pill" title="Jours d'affilée"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3-1-3 0-7 1-9.5Z" fill="var(--other)"/></svg><span id="streak">0</span></div>
    <div class="pill" title="Points d'expérience"><svg viewBox="0 0 24 24"><path d="m12 2 2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6Z" fill="var(--spark)"/></svg><span id="xp">0</span></div>
  </div>
</div></header>

<main id="home"></main>

<div id="player" hidden>
  <div class="wrap p-top" style="max-width:712px;width:100%">
    <button class="x" id="quit" aria-label="Quitter la leçon"><svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="segs" id="segs"></div>
  </div>
  <div class="p-body"><div class="wrap"><div class="card" id="card"></div></div></div>
  <div class="p-foot" id="foot"><div class="wrap">
    <div class="fb" id="fb"></div>
    <button class="btn" id="action">Continuer</button>
  </div></div>
</div>

<script>
/* ---------- état (localStorage optionnel) ---------- */
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem('declic')||'{}') }catch(e){ return {} } },
  set(v){ try{ localStorage.setItem('declic',JSON.stringify(v)) }catch(e){} }
};
let S = Object.assign({xp:0, streak:1, done:{}}, store.get());
function save(){ store.set(S); renderStats(); }
function renderStats(){ document.getElementById('xp').textContent=S.xp; document.getElementById('streak').textContent=S.streak; }

const $ = (h)=>{ const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstElementChild; };

/* ---------- audio (après interaction) ---------- */
let AC=null;
function tone(semi, when=0, dur=.6){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const f = 261.63*Math.pow(2,semi/12), t=AC.currentTime+when;
    const o=AC.createOscillator(), g=AC.createGain(), o2=AC.createOscillator(), g2=AC.createGain();
    o.type='triangle'; o.frequency.value=f; o2.type='sine'; o2.frequency.value=f*2;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.35,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    g2.gain.setValueAtTime(.08,t); g2.gain.exponentialRampToValueAtTime(.001,t+dur*.6);
    o.connect(g).connect(AC.destination); o2.connect(g2).connect(AC.destination);
    o.start(t); o2.start(t); o.stop(t+dur); o2.stop(t+dur);
  }catch(e){}
}

/* ---------- widgets ---------- */
function choices(opts, ctx, row){
  const el=$(`<div class="choices ${row?'row':''}"></div>`);
  opts.forEach((o,i)=>{
    const b=$(`<button class="choice" id="c${i}"></button>`); b.innerHTML=o;
    b.onclick=()=>{ el.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel','wrong','right')); b.classList.add('sel'); ctx.answer=i; ctx.ready(true); };
    el.appendChild(b);
  });
  ctx.mark=(ok)=>{ const s=el.querySelector('.sel'); if(s) s.classList.add(ok?'right':'wrong'); };
  return el;
}
function stepper(init,min,max,on){
  const el=$(`<div class="stepper"><button aria-label="Moins">−</button><output>${init}</output><button aria-label="Plus">+</button></div>`);
  let v=init; const out=el.querySelector('output');
  const set=n=>{ v=Math.max(min,Math.min(max,n)); out.textContent=v; on(v); };
  el.children[0].onclick=()=>set(v-1); el.children[2].onclick=()=>set(v+1);
  return el;
}

/* Graphique cartésien pour la pente */
function graph(a,b,opts={}){
  const U=24,O=156,W=312; const X=x=>O+x*U, Y=y=>O-y*U;
  let g='';
  for(let i=-6;i<=6;i++){ g+=`<line x1="${X(i)}" y1="12" x2="${X(i)}" y2="${W-12}" stroke="var(--line)" stroke-width="1"/><line x1="12" y1="${Y(i)}" x2="${W-12}" y2="${Y(i)}" stroke="var(--line)" stroke-width="1"/>`; }
  g+=`<line x1="12" y1="${O}" x2="${W-12}" y2="${O}" stroke="var(--muted)" stroke-width="1.5"/><line x1="${O}" y1="12" x2="${O}" y2="${W-12}" stroke="var(--muted)" stroke-width="1.5"/>`;
  for(const i of [-4,-2,2,4]){ g+=`<text x="${X(i)}" y="${O+16}" font-size="11" text-anchor="middle" fill="var(--muted)">${i}</text><text x="${O-8}" y="${Y(i)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${i}</text>`; }
  // droite clipée
  const x1=-6.5,x2=6.5;
  g+=`<clipPath id="cp"><rect x="12" y="12" width="${W-24}" height="${W-24}"/></clipPath><line clip-path="url(#cp)" x1="${X(x1)}" y1="${Y(a*x1+b)}" x2="${X(x2)}" y2="${Y(a*x2+b)}" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>`;
  if(opts.tri){ // triangle de pente à partir de x=1
    const x0=1,y0=a*x0+b;
    g+=`<path d="M${X(x0)} ${Y(y0)} H${X(x0+1)} V${Y(y0+a)}" fill="none" stroke="var(--spark)" stroke-width="3" stroke-dasharray="5 4"/>
        <text x="${X(x0+.5)}" y="${Y(y0)+(a>=0?18:-8)}" font-size="13" font-weight="700" text-anchor="middle" fill="var(--ink)">+1</text>
        <text x="${X(x0+1)+8}" y="${Y(y0+a/2)+4}" font-size="13" font-weight="700" fill="var(--ink)">${a>=0?'+':''}${a}</text>`;
  }
  (opts.pts||[]).forEach(p=>{ g+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="7" fill="${p[2]||'var(--spark)'}" stroke="var(--surface)" stroke-width="2"/>`; if(p[3]) g+=`<text x="${X(p[0])+10}" y="${Y(p[1])-10}" font-size="13" font-weight="700" fill="var(--ink)">${p[3]}</text>`; });
  g+=`<circle cx="${X(0)}" cy="${Y(b)}" r="5" fill="var(--accent)"/>`;
  return `<svg viewBox="0 0 ${W} ${W}" width="${W}" role="img" aria-label="Droite y = ${a}x + ${b}">${g}</svg>`;
}

/* Grille du robot */
function robotWorld(cfg){
  const C=56, N=cfg.n||5;
  const el=$(`<div class="fig"><svg viewBox="0 0 ${N*C} ${N*C}" width="${N*C}"></svg><div class="cap">${cfg.cap||''}</div></div>`);
  const svg=el.querySelector('svg');
  let st={x:cfg.start[0],y:cfg.start[1],d:cfg.dir}, trail=[[st.x,st.y]];
  const DX=[1,0,-1,0], DY=[0,1,0,-1]; // 0 est, 1 sud, 2 ouest, 3 nord
  function draw(){
    let g='';
    for(let i=0;i<N;i++)for(let j=0;j<N;j++) g+=`<rect x="${i*C+2}" y="${j*C+2}" width="${C-4}" height="${C-4}" rx="8" fill="color-mix(in srgb,var(--code) 7%,var(--surface))" stroke="var(--line)"/>`;
    if(trail.length>1) g+=`<polyline points="${trail.map(p=>`${p[0]*C+C/2},${p[1]*C+C/2}`).join(' ')}" fill="none" stroke="var(--code)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".45"/>`;
    if(cfg.flag){ const [fx,fy]=cfg.flag; g+=`<g transform="translate(${fx*C+C/2-8},${fy*C+10})"><rect x="0" y="0" width="3" height="36" fill="var(--ink)"/><path d="M3 0h20l-6 7 6 7H3z" fill="var(--spark)"/></g>`; }
    const cx=st.x*C+C/2, cy=st.y*C+C/2, rot=st.d*90;
    g+=`<g transform="translate(${cx},${cy}) rotate(${rot})"><rect x="-17" y="-17" width="34" height="34" rx="10" fill="var(--code)"/><circle cx="6" cy="-6" r="3.5" fill="#fff"/><circle cx="6" cy="6" r="3.5" fill="#fff"/><path d="M17 -6 L25 0 L17 6Z" fill="var(--code)"/></g>`;
    svg.innerHTML=g;
  }
  draw();
  const api={el,
    reset(){ st={x:cfg.start[0],y:cfg.start[1],d:cfg.dir}; trail=[[st.x,st.y]]; draw(); },
    run(prog, done){ // prog = tableau de 'A' (avancer) / 'R' (tourner à droite)
      api.reset(); let i=0, crashed=false;
      const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
      const tick=()=>{
        if(i>=prog.length||crashed){ done({x:st.x,y:st.y,d:st.d,crashed}); return; }
        const c=prog[i++];
        if(c==='A'){ const nx=st.x+DX[st.d], ny=st.y+DY[st.d]; if(nx<0||ny<0||nx>=N||ny>=N){crashed=true;} else {st.x=nx;st.y=ny;trail.push([nx,ny]);} }
        else st.d=(st.d+1)%4;
        draw(); setTimeout(tick, reduce?40:330);
      };
      setTimeout(tick,200);
    }};
  return api;
}

/* Piano Do3 → Mi4 */
const NOTE=['Do','Do♯','Ré','Ré♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'];
function piano(onKey, hi=[]){
  const el=$(`<div class="piano" role="group" aria-label="Clavier de piano"></div>`);
  const whites=[0,2,4,5,7,9,11,12,14,16], blacks=[[1,0],[3,1],[6,3],[8,4],[10,5],[13,7],[15,8]];
  const ww=100/whites.length, keys={};
  whites.forEach((s,i)=>{ const k=$(`<button class="key w" aria-label="${NOTE[s%12]}" style="left:${i*ww}%;width:${ww}%">${NOTE[s%12]}</button>`); keys[s]=k; el.appendChild(k); });
  blacks.forEach(([s,i])=>{ const k=$(`<button class="key b" aria-label="${NOTE[s%12]}" style="left:${(i+1)*ww-ww*.3}%;width:${ww*.6}%"></button>`); keys[s]=k; el.appendChild(k); });
  Object.entries(keys).forEach(([s,k])=>{ s=+s; if(hi.includes(s)) k.classList.add('hi');
    k.onclick=()=>{ tone(s); k.classList.add('on'); setTimeout(()=>k.classList.remove('on'),220); onKey&&onKey(s,keys); }; });
  el.keys=keys; return el;
}

  bars:c=>`<svg viewBox="0 0 200 92">${[30,50,20,70,40,60].map((h,i)=>`<rect x="${42+i*20}" y="${84-h}" width="14" height="${h}" rx="3" fill="${c}" opacity="${.4+i*.1}"/>`).join('')}</svg>`,
  keys:c=>`<svg viewBox="0 0 200 92">${[0,1,2,3,4,5,6].map(i=>`<rect x="${44+i*16}" y="14" width="15" height="66" rx="3" fill="${i===2?'var(--spark)':'var(--surface)'}" stroke="${c}"/>`).join('')}${[0,1,3,4,5].map(i=>`<rect x="${54+i*16}" y="14" width="10" height="40" rx="2" fill="${c}"/>`).join('')}</svg>`,
  curve:c=>`<svg viewBox="0 0 200 92"><path d="M30 80 C90 78 130 60 170 12" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round"/><path d="M30 80 L170 52" stroke="${c}" stroke-width="2" stroke-dasharray="4 4" opacity=".5"/></svg>`,
  sail:c=>`<svg viewBox="0 0 200 92"><path d="M100 10 V68 H66Z" fill="${c}"/><path d="M104 18 V68 H128Z" fill="${c}" opacity=".5"/><path d="M60 72 H140 L128 84 H72Z" fill="${c}"/></svg>`,
  logic:c=>`<svg viewBox="0 0 200 92"><circle cx="86" cy="46" r="28" fill="${c}" opacity=".35"/><circle cx="114" cy="46" r="28" fill="${c}" opacity=".35"/></svg>`,
};

/* ---------- accueil ---------- */
let VIEW='home', LV=(()=>{ try{ return localStorage.getItem('declic-lv')||'ecole' }catch(e){ return 'ecole' } })();
function thumb(c){
  if(c.use) return graph(1,0,{tri:true});
  const st=c.steps.find(s=>s.draw); const v={}; st.params.forEach(p=>v[p.id]=p.v); return st.draw(v);
}
function render(){ if(VIEW==='home') renderHome(); else if(VIEW.startsWith('cms:')) renderSubject(VIEW.slice(4)); else renderCourse(VIEW); window.scrollTo(0,0); }
function stepsThumb(steps){ const st=(steps||[]).find(s=>s.draw); if(!st) return ''; const v={}; st.params.forEach(p=>v[p.id]=p.v); try{ return st.draw(v); }catch(e){ return ''; } }

function renderCMS(h){
  const live=CMS_SUBJECTS.filter(sj=>CMS.some(c=>c.subj===sj.id)); if(!live.length) return;
  const sec=$(`<section class="wrap domain" id="cms">
    <div class="math-head"><div><h2>Année préparatoire</h2><p>Le programme du cours de mathématiques spéciales (CMS) : ${CMS.length} chapitres en ${live.length} branches, chacun avec sa théorie et ses exercices.</p>
    <p class="disclaim">Contenu indépendant, construit à partir du programme officiel.</p></div></div>
    <div class="subjects"></div></section>`);
  live.forEach(sj=>{
    const chs=cmsChapters(sj), fin=chs.filter(c=>S.done[c.id]).length, codes=[...new Set(Object.values(sj.sems).map(s=>s.code))].join(' · ');
    const card=$(`<button class="course" style="--c:${sj.c}"><div class="ill plot">${stepsThumb(chs[0].steps)}</div><h3>${sj.h}</h3><span class="codes">${codes}</span>
      <div class="bar"><span style="width:${fin/chs.length*100}%"></span></div>
      <div class="meta"><span>${fin} / ${chs.length} chapitres</span><span class="tag">${Object.values(sj.sems).map(s=>s.h).join(' + ')}</span></div></button>`);
    card.onclick=()=>go('cms:'+sj.id); sec.querySelector('.subjects').append(card);
  });
  h.append(sec);
}

function renderSubject(id){
  const sj=CMS_SUBJECTS.find(s=>s.id===id), h=document.getElementById('home'); h.innerHTML='';
  const chs=cmsChapters(sj), fin=chs.filter(c=>S.done[c.id]).length;
  const page=$(`<section class="wrap cpage"><div>
      <button class="crumb" id="back">← Année préparatoire</button>
      <div class="kicker" style="margin-top:18px">${[...new Set(Object.values(sj.sems).map(s=>s.code))].join(' · ')}</div>
      <h1>${sj.h}</h1><p class="lead">${chs.length} chapitres · ${fin} terminé${fin>1?'s':''}</p>
      <div class="bar" style="margin-top:12px"><span style="width:${fin/chs.length*100}%"></span></div>
      <div id="sems"></div>
    </div><div class="ill">${stepsThumb(chs[0].steps)}</div></section>`);
  let n=0;
  Object.entries(sj.sems).forEach(([k,sem])=>{
    const list=CMS.filter(c=>c.subj===id&&c.sem===k); if(!list.length) return;
    const box=$(`<div class="sem"><h2>${sem.h} <span class="codes" style="font:600 14px var(--f-mono);color:var(--muted)">${sem.code}</span></h2><p class="sub">${sem.s}</p><ol class="lessons"></ol></div>`);
    list.forEach(c=>{ n++; const d=S.done[c.id];
      const li=$(`<li class="${d?'fin':'play'}"><span class="n">${d?'✓':n}</span><div><b>${c.h}</b><div class="s">${c.steps.length} étapes · ${c.p}</div></div><button class="btn">${d?'Revoir':'Commencer'}</button></li>`);
      li.querySelector('button').onclick=()=>openLesson(c.id); box.querySelector('ol').append(li); });
    page.querySelector('#sems').append(box);
  });
  page.querySelector('#back').onclick=()=>{ go('home'); requestAnimationFrame(()=>document.getElementById('cms')?.scrollIntoView()); };
  h.append(page);
}
function go(v){ VIEW=v; render(); }

function renderMath(h){
  const sec=$(`<section class="wrap domain" id="maths">
    <div class="math-head"><div><h2>Mathématiques</h2><p>${MATHS.length} cours, de l’école obligatoire à l’université. Algèbre, analyse et géométrie.</p></div>
    <div class="levels" role="tablist" aria-label="Niveau">${Object.entries(LEVELS).map(([k,l])=>`<button role="tab" id="lv-${k}" aria-selected="${k===LV}" data-lv="${k}">${l.h}<small>${l.s}</small></button>`).join('')}</div></div>
    <div class="branches"></div></section>`);
  sec.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{ LV=b.dataset.lv; try{ localStorage.setItem('declic-lv',LV) }catch(e){} renderHome(); document.getElementById('lv-'+LV).focus(); });
  const br=sec.querySelector('.branches');
  Object.entries(BRANCHES).forEach(([k,name])=>{
    const col=$(`<div class="branch"><h3>${name}</h3></div>`);
    MATHS.filter(c=>c.br===k&&c.lv===LV).forEach(c=>{
      const fin=S.done[c.lid];
      const card=$(`<button class="course" style="--c:var(--math)"><div class="ill plot">${thumb(c)}</div><h3>${c.h}</h3><p>${c.p}</p>
        <div class="meta">${fin?'<span style="color:var(--ok)">✓ 1re leçon terminée</span>':`<span>${c.lessons.length} leçons</span>`}<span class="tag">${LEVELS[c.lv].h}</span></div></button>`);
      card.onclick=()=>go(c.id); col.append(card);
    });
    br.append(col);
  });
  h.append(sec);
}

function renderCourse(id){
  const c=MATHS.find(m=>m.id===id), h=document.getElementById('home'); h.innerHTML='';
  const page=$(`<section class="wrap cpage"><div>
      <button class="crumb" id="back">← Mathématiques</button>
      <div class="kicker" style="margin-top:18px">${BRANCHES[c.br]} · ${LEVELS[c.lv].h}</div>
      <h1>${c.h}</h1><p class="lead">${c.p}</p>
      <ol class="lessons">${c.lessons.map((t,i)=>{ const fin=i===0&&S.done[c.lid];
        return `<li class="${i===0?(fin?'fin':'play'):''}"><span class="n">${fin?'✓':i+1}</span><div><b>${t}</b><div class="s">${i===0?(fin?'Terminée · à revoir quand tu veux':'4 étapes · 5 min'):'Bientôt'}</div></div>${i===0?`<button class="btn" id="start">${fin?'Revoir':'Commencer'}</button>`:''}</li>`; }).join('')}</ol>
    </div><div class="ill">${thumb(c)}</div></section>`);
  page.querySelector('#back').onclick=()=>{ go('home'); requestAnimationFrame(()=>document.getElementById('maths')?.scrollIntoView()); };
  page.querySelector('#start').onclick=()=>openLesson(c.lid);
  h.append(page);
}

function renderHome(){
  const order=[...CMS.map(c=>({lid:c.id})),...MATHS.filter(c=>c.lv===LV),...MATHS.filter(c=>c.lv!==LV)].map(c=>c.lid).concat(['boucles','intervalles']);
  const total=Object.keys(LESSONS).length, done=Object.keys(S.done).filter(k=>LESSONS[k]).length;
  const next=order.find(k=>!S.done[k])||order[0];
  const h=document.getElementById('home'); h.innerHTML='';
  const hero=$(`<section class="wrap hero">
    <div><h1>Comprendre<br>en <em>faisant</em>.</h1>
    <p>Des leçons de cinq minutes : un peu de théorie, une illustration que tu manipules, puis un exercice qui te répond tout de suite.</p></div>
    <div class="resume"><small>Reprendre</small><h3>${LESSONS[next].title}</h3>
      <div class="bar"><span style="width:${done/total*100}%"></span></div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span style="color:var(--muted);font-size:15px">${done} / ${total} leçons terminées</span><button class="btn" id="go">${done?'Continuer':'Commencer'}</button></div></div>
  </section>`);
  hero.querySelector('#go').onclick=()=>openLesson(next);
  h.append(hero);
  renderCMS(h);
  renderMath(h);
  CATALOG.forEach(d=>{
    const sec=$(`<section class="wrap domain"><div class="domain-head"><h2>${d.name}</h2><span>${d.sub}</span></div><div class="grid"></div></section>`);
    d.items.forEach(it=>{
      const playable=!!it.id, fin=playable&&S.done[it.id];
      const card=$(`<button class="course ${playable?'':'soon'}" style="--c:${d.c}" ${playable?'':'aria-disabled="true"'}>
        <div class="ill">${ILL[it.ill](d.c)}</div><h3>${it.h}</h3><p>${it.p}</p>
        <div class="meta">${playable?(fin?'<span style="color:var(--ok)">✓ Terminé</span>':'<span>5 étapes · 5 min</span>'):'<span>Bientôt</span>'}${it.new?'<span class="tag new">Inédit</span>':`<span class="tag">${d.name.split(' ')[0]}</span>`}</div></button>`);
      if(playable) card.onclick=()=>openLesson(it.id);
      sec.querySelector('.grid').append(card);
    });
    h.append(sec);
  });
  h.append($(`<footer class="wrap">Prototype Déclic · ${total} leçons jouables. Ta progression reste dans ce navigateur.</footer>`));
}

/* ---------- lecteur ---------- */
let L=null, idx=0, ctx=null, phase='idle';
const foot=document.getElementById('foot'), fb=document.getElementById('fb'), act=document.getElementById('action');
function openLesson(id){ L=LESSONS[id]; L.id=id; idx=0; document.getElementById('player').hidden=false; document.body.style.overflow='hidden'; showStep(); }
function closeLesson(){ document.getElementById('player').hidden=true; document.body.style.overflow=''; render(); }

/* Étape décrite par des données (voir l'en-tête de maths.js) */
function parseNum(s){ s=s.replace(/[\s']/g,'').replace(/,/g,'.').replace(/−/g,'-'); if(!s) return NaN; if(s.includes('/')){ const [a,b]=s.split('/').map(Number); return a/b; } return Number(s); }
function buildStep(st,c,ctx){
  if(st.h) c.append($(`<h2>${st.h}</h2>`));
  if(st.p) c.append($(`<div class="ptext">${st.p}</div>`));
  if(st.fig) c.append($(`<div class="fig">${st.fig}</div>`));
  if(st.params){
    const vals={}; st.params.forEach(p=>vals[p.id]=p.v);
    const fig=$(`<div class="fig"><div class="draw"></div><div class="cap info"></div><div class="sliders"></div></div>`);
    const upd=()=>{ fig.querySelector('.draw').innerHTML=st.draw(vals); const inf=fig.querySelector('.info'); inf.hidden=!st.info; if(st.info) inf.innerHTML=st.info(vals); };
    st.params.forEach(p=>{
      const sid=`s-${ctx.uid}-${p.id}`, s=$(`<div class="slider"><label for="${sid}">${p.l} <output>${fmt(p.v)}${p.u||''}</output></label><input id="${sid}" type="range" min="${p.min}" max="${p.max}" step="${p.step||1}" value="${p.v}"></div>`);
      const inp=s.querySelector('input');
      inp.oninput=()=>{ const st0=p.step||1; vals[p.id]=+(p.min+Math.round((+inp.value-p.min)/st0)*st0).toFixed(6); s.querySelector('output').textContent=fmt(vals[p.id])+(p.u||''); upd(); if(phase==='ask') setFoot('','','','Vérifier'); };
      fig.querySelector('.sliders').append(s);
    });
    upd(); c.append(fig);
    if(st.ok){ ctx.answer=vals; ctx.check=()=>({ok:st.ok(vals),why:st.why}); }
  }
  if(st.opts){ c.append(choices(st.opts,ctx,st.opts.every(o=>o.replace(/<[^>]+>/g,'').length<14))); ctx.check=()=>({ok:ctx.answer===st.ans,why:st.why}); }
  else if('ans' in st){
    const id='n-'+ctx.uid, w=$(`<div class="numin"><label for="${id}">${st.lab||'Ta réponse'}</label><div><input id="${id}" type="text" inputmode="decimal" autocomplete="off" placeholder="?"><span>${st.unit||''}</span></div></div>`);
    const inp=w.querySelector('input');
    inp.oninput=()=>{ inp.classList.remove('right','wrong'); const v=parseNum(inp.value); ctx.answer=isNaN(v)?null:v; ctx.ready(!isNaN(v)); };
    inp.onkeydown=e=>{ if(e.key==='Enter'&&!act.disabled) act.click(); };
    ctx.mark=ok=>inp.classList.add(ok?'right':'wrong');
    ctx.check=()=>({ok:Math.abs(ctx.answer-st.ans)<=(st.tol??1e-9),why:st.why});
    c.append(w); setTimeout(()=>inp.focus({preventScroll:true}),50);
  }
  if(st.note) c.append($(`<div class="note">${st.note}</div>`));
}
const kindOf=st=>st.kind||(st.ok?'Pratique':(st.opts||'ans' in st)?'Question':'Théorie');
function segs(){ document.getElementById('segs').innerHTML=L.steps.map((_,i)=>`<span class="${i<idx?'done':i===idx?'cur':''}"></span>`).join(''); }
function setFoot(state,title,txt,label,enabled=true){
  foot.className='p-foot'+(state?' '+state:''); fb.innerHTML=title?`<strong>${title}</strong><span>${txt||''}</span>`:''; act.textContent=label; act.disabled=!enabled;
}
function showStep(){
  segs(); const card=document.getElementById('card'); card.innerHTML=''; card.style.animation='none'; card.offsetHeight; card.style.animation='';
  const st=L.steps[idx];
  const course=COURSE_OF[L.id], cms=CMS_OF[L.id];
  card.append($(`<div class="kicker">${L.domain}${course?' · '+LEVELS[course.lv].h:''}${cms?' · '+cms.sem.h:''} · ${kindOf(st)}</div>`));
  ctx={answer:null, tries:0, uid:L.id+idx, ready:(r)=>{ if(phase==='ask') act.disabled=!r; }};
  phase='build';
  if(st.render) st.render(card,ctx); else buildStep(st,card,ctx);
  document.querySelector('.p-body').scrollTop=0;
  if(ctx.check){ phase='ask'; setFoot('', '', '', 'Vérifier', ctx.answer!==null); }
  else { phase='next'; setFoot('', '', '', 'Continuer'); }
}
async function onAction(){
  if(phase==='ask'){
    act.disabled=true; phase='checking';
    const r=await ctx.check(); ctx.tries++;
    ctx.mark&&ctx.mark(r.ok);
    if(r.ok){ phase='next'; S.xp+=ctx.tries===1?10:5; save(); setFoot('ok', ctx.tries===1?'Bravo !':'C’est ça !', r.why, 'Continuer'); }
    else { phase='ask'; setFoot('bad','Pas tout à fait', ctx.tries>=2?r.why:'Essaie encore. Indice disponible au prochain essai.', 'Vérifier'); }
    return;
  }
  if(phase==='next'){
    if(idx<L.steps.length-1){ idx++; showStep(); }
    else finish();
  } else if(phase==='end') closeLesson();
}
function finish(){
  idx=L.steps.length; segs();
  const first=!S.done[L.id]; S.done[L.id]=true; if(first) S.xp+=20; save();
  const card=document.getElementById('card');
  card.innerHTML=`<div class="done-wrap"><svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="var(--spark-soft)"/><path d="m60 22 10.6 23.4 25.4 2.4-19.2 16.8 5.6 25L60 76.8 37.6 89.6l5.6-25L24 47.8l25.4-2.4Z" fill="var(--spark)"/></svg>
    <h2>Leçon terminée</h2><div class="big-xp">${S.xp} XP</div><p style="color:var(--muted)">${first?'+20 XP de bonus pour ta première fois.':'Révision faite.'} Reviens demain pour garder ta série.</p></div>`;
  phase='end'; setFoot('', '', '', (COURSE_OF[L.id]||CMS_OF[L.id])?'Retour au cours':'Retour au catalogue');
}
act.onclick=onAction;
document.getElementById('quit').onclick=closeLesson;
document.getElementById('home-btn').onclick=()=>{ document.getElementById('player').hidden=true; document.body.style.overflow=''; go('home'); };
renderStats(); render();
</script>
